<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Breakout</title>
<style>
  :root { --bg:#fffaf7; --panel:#ffffff; --ink:#1a1412; --muted:#8a7168; --accent:#ff5c39; --ok:#22a06b; --line:rgba(201,68,36,0.12); }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background: transparent; color:var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding:12px; gap:10px; }
  h1 { margin:0; font-size:1.15rem; letter-spacing:.02em; }
  .hud { display:flex; gap:14px; flex-wrap:wrap; align-items:center; justify-content:center; color:var(--muted); font-size:.9rem; }
  .hud b { color:var(--ink); }
  canvas, .board { background:var(--panel); border:1px solid #243149; border-radius:14px; box-shadow:0 10px 40px rgba(0,0,0,.35); touch-action:none; }
  button { appearance:none; border:0; border-radius:999px; padding:10px 16px; background:var(--accent); color:#fff; font-weight:700; cursor:pointer; }
  button.secondary { background:#243149; color:var(--ink); }
  .row { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .hint { color:var(--muted); font-size:.8rem; text-align:center; max-width:520px; }
  .grid { display:grid; gap:6px; }
  .cell { display:flex; align-items:center; justify-content:center; border-radius:8px; background:#1a2438; cursor:pointer; user-select:none; font-weight:700; }
  input { background:#1a2438; border:1px solid #243149; color:var(--ink); border-radius:8px; padding:8px 10px; }

  html, body { width:100%; height:100%; margin:0; overflow:hidden; }
  body { min-height:100vh; min-height:100dvh; justify-content:center; padding: clamp(8px, 2vh, 16px); gap:8px; }
  h1 { font-size: clamp(1rem, 2.4vh, 1.25rem); }
  canvas { width: min(96vw, 920px) !important; height: auto !important; max-height: min(78vh, 78dvh); }
  .board { max-width: min(96vw, 920px); }


  body { display:flex; flex-direction:column; align-items:center; justify-content:center; }
  canvas {
    width: min(96vw, 1100px) !important;
    height: auto !important;
    max-height: min(82vh, 82dvh);
  }
  .board { width: min(96vw, 720px); }
  .row, .hud, h1, .hint { flex-shrink: 0; }


  html, body {
    background:
      radial-gradient(900px 520px at 50% -8%, #ffffff 0%, transparent 58%),
      radial-gradient(720px 420px at 8% 40%, rgba(255, 92, 57, 0.10), transparent 55%),
      radial-gradient(640px 380px at 92% 30%, rgba(255, 212, 200, 0.45), transparent 50%),
      #fffaf7 !important;
  }
  canvas, .board {
    background: #ffffff !important;
    border: 1px solid rgba(201,68,36,0.12) !important;
    box-shadow: 0 18px 50px rgba(40,24,12,0.08) !important;
  }
  h1 { color: #1a1412 !important; }
  .hud { color: #8a7168 !important; }
  .hud b { color: #1a1412 !important; }
  .hint { color: #8a7168 !important; }
  button { background: #ff5c39 !important; }
  button.secondary { background: #fff5f0 !important; color: #1a1412 !important; border: 1px solid rgba(201,68,36,0.12); }
  .cell { background: #fff5f0 !important; color: #1a1412; border: 1px solid rgba(201,68,36,0.08); }
  /* body-bg-cream */
</style>
</head>
<body>

<h1>Breakout</h1>
<div class="hud"><span>Score <b id="score">0</b></span><span>Lives <b id="lives">3</b></span></div>
<canvas id="c" width="480" height="360"></canvas>
<p class="hint">Move paddle with mouse / ← →. Clear all bricks.</p>

<script>

const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let paddle,ball,bricks,score,lives,running;
function reset(full=true){paddle={x:200,w:80,h:12}; if(full){score=0;lives=3;} ball={x:240,y:300,vx:3.2,vy:-3.6,r:6};
  bricks=[]; const colors=['#ef4444','#f97316','#eab308','#22c55e','#3b82f6'];
  for(let r=0;r<5;r++)for(let c=0;c<10;c++)bricks.push({x:16+c*46,y:40+r*22,w:42,h:16,alive:true,color:colors[r]});
  document.getElementById('score').textContent=score; document.getElementById('lives').textContent=lives; running=true;}
function frame(){if(running){ball.x+=ball.vx; ball.y+=ball.vy;
  if(ball.x<ball.r||ball.x>480-ball.r)ball.vx*=-1; if(ball.y<ball.r)ball.vy*=-1;
  if(ball.y>360){lives--; document.getElementById('lives').textContent=lives; if(lives<=0){running=false;window.shrimpyLose&&window.shrimpyLose();} else {ball.x=240;ball.y=300;ball.vx=3.2;ball.vy=-3.6;}}
  if(ball.y+ball.r>340&&ball.x>paddle.x&&ball.x<paddle.x+paddle.w){ball.vy=-Math.abs(ball.vy); ball.vx+=(ball.x-(paddle.x+paddle.w/2))*0.08;}
  bricks.forEach(b=>{if(!b.alive)return; if(ball.x>b.x&&ball.x<b.x+b.w&&ball.y>b.y&&ball.y<b.y+b.h){b.alive=false;ball.vy*=-1;score+=10;document.getElementById('score').textContent=score;}});
  if(bricks.every(b=>!b.alive))running=false;}
  ctx.fillStyle='#fffaf7';ctx.fillRect(0,0,480,360); bricks.forEach(b=>{if(!b.alive)return;ctx.fillStyle=b.color;ctx.fillRect(b.x,b.y,b.w,b.h);});
  ctx.fillStyle='#e2e8f0';ctx.fillRect(paddle.x,340,paddle.w,paddle.h); ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fillStyle='#67e8f9';ctx.fill();
  if(!running){ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(0,0,480,360);ctx.fillStyle='#fff';ctx.font='bold 24px sans-serif';ctx.textAlign='center';ctx.fillText(bricks.every(b=>!b.alive)?'You cleared it!':'Game Over',240,180);ctx.font='14px sans-serif';ctx.fillText('Click to restart',240,210);}
  requestAnimationFrame(frame);}
canvas.onmousemove=e=>{const r=canvas.getBoundingClientRect(); paddle.x=Math.max(0,Math.min(400,e.clientX-r.left-paddle.w/2));};
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')paddle.x-=24; if(e.key==='ArrowRight')paddle.x+=24;});
canvas.onclick=()=>{if(!running&&!window.__shrLost)reset(true);}; reset(); frame();

</script>

<script>
(function(){
  window.__shrLost=false;
  window.shrimpyLose=function(){
    if(window.__shrLost) return;
    window.__shrLost=true;
    try{ parent.postMessage({type:'shrimpy-lose', game: location.pathname}, '*'); }catch(e){}
  };
  window.shrimpyReady=function(){
    window.__shrLost=false;
    try{ parent.postMessage({type:'shrimpy-ready', game: location.pathname}, '*'); }catch(e){}
  };
  window.addEventListener('message', function(e){
    if(!e.data || e.data.type!=='shrimpy-unlock') return;
    window.__shrLost=false;
    location.reload();
  });
  document.addEventListener('DOMContentLoaded', function(){ window.shrimpyReady && window.shrimpyReady(); });
  window.shrimpyReady();
})();
</script>

</body>
</html>
