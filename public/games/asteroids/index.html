<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Asteroids</title>
<style>
  :root { --bg:#fffaf7; --panel:#ffffff; --ink:#1a1412; --muted:#8a7168; --accent:#ff5c39; --ok:#22a06b; --line:rgba(201,68,36,0.12); }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background: transparent; color:var(--ink); font-family: ui-sans-serif, system-ui, sans-serif; }
  body { display:flex; flex-direction:column; align-items:center; padding:12px; gap:10px; }
  h1 { margin:0; font-size:1.15rem; }
  .hud { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; color:var(--muted); font-size:.9rem; }
  .hud b { color:var(--ink); }
  canvas, .board { background:var(--panel); border:1px solid #243149; border-radius:14px; box-shadow:0 10px 40px rgba(0,0,0,.35); touch-action:none; }
  button { appearance:none; border:0; border-radius:999px; padding:10px 16px; background:var(--accent); color:#fff; font-weight:700; cursor:pointer; }
  button.secondary { background:#243149; color:var(--ink); }
  .row { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .hint { color:var(--muted); font-size:.8rem; text-align:center; max-width:520px; }
  .grid { display:grid; gap:4px; }
  .cell { display:flex; align-items:center; justify-content:center; border-radius:6px; background:#1a2438; cursor:pointer; user-select:none; font-weight:700; }
  input { width:28px; text-align:center; background:#1a2438; border:1px solid #243149; color:var(--ink); border-radius:6px; padding:6px 0; }

  html, body { width:100%; height:100%; margin:0; overflow:hidden; }
  body { min-height:100vh; min-height:100dvh; justify-content:center; padding: clamp(8px, 2vh, 16px); gap:8px; }
  h1 { font-size: clamp(1rem, 2.4vh, 1.25rem); }
  canvas { width: min(96vw, 920px) !important; height: auto !important; max-height: min(78vh, 78dvh); }
  .board { max-width: min(96vw, 920px); }


  body { display:flex; flex-direction:column; align-items:center; justify-content:center; }
  canvas {
    width: min(96vw, 1100px) !important;
    height: auto !important;
    max-height: min(82vh, 82dvh);
  }
  .board { width: min(96vw, 720px); }
  .row, .hud, h1, .hint { flex-shrink: 0; }


  html, body {
    background:
      radial-gradient(900px 520px at 50% -8%, #ffffff 0%, transparent 58%),
      radial-gradient(720px 420px at 8% 40%, rgba(255, 92, 57, 0.10), transparent 55%),
      radial-gradient(640px 380px at 92% 30%, rgba(255, 212, 200, 0.45), transparent 50%),
      #fffaf7 !important;
  }
  canvas, .board {
    background: #ffffff !important;
    border: 1px solid rgba(201,68,36,0.12) !important;
    box-shadow: 0 18px 50px rgba(40,24,12,0.08) !important;
  }
  h1 { color: #1a1412 !important; }
  .hud { color: #8a7168 !important; }
  .hud b { color: #1a1412 !important; }
  .hint { color: #8a7168 !important; }
  button { background: #ff5c39 !important; }
  button.secondary { background: #fff5f0 !important; color: #1a1412 !important; border: 1px solid rgba(201,68,36,0.12); }
  .cell { background: #fff5f0 !important; color: #1a1412; border: 1px solid rgba(201,68,36,0.08); }
  /* body-bg-cream */
</style>
</head>
<body>

<h1>Asteroids</h1>
<div class="hud"><span>Score <b id="score">0</b></span><span>Lives <b id="lives">3</b></span></div>
<canvas id="c" width="520" height="400"></canvas>
<p class="hint">← → rotate · ↑ thrust · Space shoot</p>

<script>

const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let ship,rocks,bullets,score,lives,alive,keys=new Set();
function spawnRocks(n){rocks=[]; for(let i=0;i<n;i++)rocks.push({x:Math.random()*520,y:Math.random()*400,vx:(Math.random()*2-1)*1.5,vy:(Math.random()*2-1)*1.5,r:18+Math.random()*16});}
function reset(){ship={x:260,y:200,a:-Math.PI/2,vx:0,vy:0}; bullets=[]; score=0; lives=3; alive=true; spawnRocks(5); document.getElementById('score').textContent=0; document.getElementById('lives').textContent=3;}
function wrap(o){if(o.x<0)o.x+=520; if(o.x>520)o.x-=520; if(o.y<0)o.y+=400; if(o.y>400)o.y-=400;}
function frame(){if(alive){if(keys.has('ArrowLeft'))ship.a-=0.07; if(keys.has('ArrowRight'))ship.a+=0.07;
  if(keys.has('ArrowUp')){ship.vx+=Math.cos(ship.a)*0.12; ship.vy+=Math.sin(ship.a)*0.12;}
  ship.x+=ship.vx; ship.y+=ship.vy; ship.vx*=0.99; ship.vy*=0.99; wrap(ship);
  bullets.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.life--;}); bullets=bullets.filter(b=>b.life>0); bullets.forEach(wrap);
  rocks.forEach(r=>{r.x+=r.vx;r.y+=r.vy;wrap(r);});
  const next=[]; rocks.forEach(r=>{let hit=false; bullets.forEach(b=>{if(Math.hypot(b.x-r.x,b.y-r.y)<r.r){hit=true;b.life=0;score+=10;document.getElementById('score').textContent=score;}});
    if(hit){if(r.r>14){next.push({x:r.x,y:r.y,vx:r.vx+1,vy:r.vy-1,r:r.r/2},{x:r.x,y:r.y,vx:r.vx-1,vy:r.vy+1,r:r.r/2});}} else next.push(r);
    if(Math.hypot(ship.x-r.x,ship.y-r.y)<r.r+10){lives--; document.getElementById('lives').textContent=lives; ship.x=260;ship.y=200;ship.vx=0;ship.vy=0; if(lives<=0){alive=false;window.shrimpyLose&&window.shrimpyLose();}}});
  rocks=next; if(!rocks.length)spawnRocks(6);}
  ctx.fillStyle='#fffaf7';ctx.fillRect(0,0,520,400); ctx.strokeStyle='#cbd5e1'; rocks.forEach(r=>{ctx.beginPath(); for(let i=0;i<8;i++){const ang=i/8*Math.PI*2, rad=r.r*(0.75+((i*37)%10)/30); const x=r.x+Math.cos(ang)*rad,y=r.y+Math.sin(ang)*rad; i?ctx.lineTo(x,y):ctx.moveTo(x,y);} ctx.closePath();ctx.stroke();});
  ctx.save(); ctx.translate(ship.x,ship.y); ctx.rotate(ship.a); ctx.strokeStyle='#67e8f9'; ctx.beginPath(); ctx.moveTo(14,0); ctx.lineTo(-10,8); ctx.lineTo(-6,0); ctx.lineTo(-10,-8); ctx.closePath(); ctx.stroke(); ctx.restore();
  ctx.fillStyle='#fbbf24'; bullets.forEach(b=>{ctx.beginPath();ctx.arc(b.x,b.y,2,0,Math.PI*2);ctx.fill();});
  if(!alive){ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,0,520,400);ctx.fillStyle='#fff';ctx.font='bold 24px sans-serif';ctx.textAlign='center';ctx.fillText('Game Over',260,200);ctx.font='14px sans-serif';ctx.fillText('Click to restart',260,230);}
  requestAnimationFrame(frame);}
addEventListener('keydown',e=>{keys.add(e.key); if(e.key===' '){e.preventDefault(); if(alive)bullets.push({x:ship.x+Math.cos(ship.a)*14,y:ship.y+Math.sin(ship.a)*14,vx:Math.cos(ship.a)*6,vy:Math.sin(ship.a)*6,life:45});}});
addEventListener('keyup',e=>keys.delete(e.key)); canvas.onclick=()=>{if(!alive&&!window.__shrLost)reset();}; reset(); frame();

</script>

<script>
(function(){
  window.__shrLost=false;
  window.shrimpyLose=function(){
    if(window.__shrLost) return;
    window.__shrLost=true;
    try{ parent.postMessage({type:'shrimpy-lose', game: location.pathname}, '*'); }catch(e){}
  };
  window.shrimpyReady=function(){
    window.__shrLost=false;
    try{ parent.postMessage({type:'shrimpy-ready', game: location.pathname}, '*'); }catch(e){}
  };
  window.addEventListener('message', function(e){
    if(!e.data || e.data.type!=='shrimpy-unlock') return;
    window.__shrLost=false;
    location.reload();
  });
  document.addEventListener('DOMContentLoaded', function(){ window.shrimpyReady && window.shrimpyReady(); });
  window.shrimpyReady();
})();
</script>

</body>
</html>
