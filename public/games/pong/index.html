<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Neon Pong</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Space+Grotesk:wght@400;600&display=swap');
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background:
      radial-gradient(ellipse 80% 60% at 50% -10%, rgba(56,189,248,.22), transparent 55%),
      radial-gradient(ellipse 50% 40% at 90% 80%, rgba(255,92,57,.18), transparent 50%),
      #070b16;
    color: #e8f1ff;
    font-family: 'Space Grotesk', system-ui, sans-serif;
  }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 12px; }
  h1 {
    margin: 0; font-family: Orbitron, sans-serif; font-size: clamp(1rem, 2.4vh, 1.35rem);
    letter-spacing: .18em; text-transform: uppercase;
    background: linear-gradient(90deg, #67e8f9, #ff5c39);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hud {
    display: flex; gap: 18px; flex-wrap: wrap; justify-content: center;
    font-size: .85rem; color: #8ba3c7;
  }
  .hud b { color: #fff; font-family: Orbitron, sans-serif; }
  canvas {
    width: min(96vw, 980px) !important;
    height: auto !important;
    max-height: min(78vh, 78dvh);
    border-radius: 18px;
    border: 1px solid rgba(103,232,249,.28);
    box-shadow:
      0 0 0 1px rgba(255,92,57,.12),
      0 25px 80px rgba(0,0,0,.55),
      0 0 60px rgba(56,189,248,.15);
    outline: none;
    cursor: none;
    background: #050814;
  }
  .hint { margin: 0; color: #6d86ab; font-size: .78rem; text-align: center; }
</style>
</head>
<body>
<h1>Neon Pong</h1>
<div class="hud"><span>You <b id="you">0</b></span><span>AI <b id="ai">0</b></span></div>
<canvas id="c" width="800" height="450" tabindex="0"></canvas>
<p class="hint">W / S or ↑ / ↓ · First to 7 · Click arena to focus controls</p>
<script>
(function () {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const W = 800, H = 450;
  const keys = new Set();
  let py = H / 2 - 40, ay = H / 2 - 40, ball, you = 0, ai = 0, over = false, trail = [];

  function serve() {
    const dir = Math.random() > 0.5 ? 1 : -1;
    ball = { x: W / 2, y: H / 2, vx: dir * 5.2, vy: (Math.random() * 2 - 1) * 3.4, r: 9 };
    trail = [];
  }
  function reset() {
    you = 0; ai = 0; over = false;
    document.getElementById('you').textContent = 0;
    document.getElementById('ai').textContent = 0;
    py = ay = H / 2 - 40;
    serve();
  }

  function drawArena() {
    const g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, '#08101f');
    g.addColorStop(0.5, '#0a1428');
    g.addColorStop(1, '#0d1830');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // perspective floor grid
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, W, H);
    ctx.clip();
    ctx.strokeStyle = 'rgba(56,189,248,0.08)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 12; i++) {
      const t = i / 12;
      const y = H * 0.35 + t * t * H * 0.7;
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }
    for (let i = -8; i <= 8; i++) {
      ctx.beginPath();
      ctx.moveTo(W / 2 + i * 18, H * 0.32);
      ctx.lineTo(W / 2 + i * 70, H);
      ctx.stroke();
    }
    ctx.restore();

    // neon walls
    const wall = ctx.createLinearGradient(0, 0, 0, H);
    wall.addColorStop(0, 'rgba(103,232,249,0.55)');
    wall.addColorStop(1, 'rgba(255,92,57,0.35)');
    ctx.fillStyle = wall;
    ctx.fillRect(0, 0, W, 4);
    ctx.fillRect(0, H - 4, W, 4);

    // center gate
    ctx.shadowColor = '#67e8f9';
    ctx.shadowBlur = 12;
    for (let y = 12; y < H; y += 22) {
      ctx.fillStyle = 'rgba(103,232,249,0.35)';
      ctx.fillRect(W / 2 - 2, y, 4, 12);
    }
    ctx.shadowBlur = 0;
  }

  function drawPaddle(x, y, color, glow) {
    ctx.save();
    ctx.shadowColor = glow;
    ctx.shadowBlur = 22;
    const g = ctx.createLinearGradient(x, y, x + 14, y + 80);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.2, color);
    g.addColorStop(1, '#0b1220');
    ctx.fillStyle = g;
    roundRect(x, y, 14, 80, 7);
    ctx.fill();
    // 3D edge
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    roundRect(x + 2, y + 4, 4, 72, 3);
    ctx.fill();
    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawBall() {
    trail.push({ x: ball.x, y: ball.y });
    if (trail.length > 14) trail.shift();
    trail.forEach((p, i) => {
      const a = i / trail.length;
      ctx.beginPath();
      ctx.fillStyle = `rgba(103,232,249,${a * 0.35})`;
      ctx.arc(p.x, p.y, ball.r * (0.4 + a * 0.6), 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.save();
    ctx.shadowColor = '#67e8f9';
    ctx.shadowBlur = 28;
    const g = ctx.createRadialGradient(ball.x - 3, ball.y - 3, 1, ball.x, ball.y, ball.r + 2);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.45, '#67e8f9');
    g.addColorStop(1, '#0284c7');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function frame() {
    const speed = 7.2;
    if (!over) {
      if (keys.has('ArrowUp') || keys.has('w') || keys.has('W')) py -= speed;
      if (keys.has('ArrowDown') || keys.has('s') || keys.has('S')) py += speed;
      py = Math.max(8, Math.min(H - 88, py));
      ay += (ball.y - (ay + 40)) * 0.085;
      ay = Math.max(8, Math.min(H - 88, ay));

      ball.x += ball.vx;
      ball.y += ball.vy;
      if (ball.y < 12 || ball.y > H - 12) ball.vy *= -1;

      if (ball.x < 36 && ball.x > 18 && ball.y > py && ball.y < py + 80) {
        ball.vx = Math.abs(ball.vx) * 1.05;
        ball.vy += (ball.y - (py + 40)) * 0.14;
      }
      if (ball.x > W - 36 && ball.x < W - 18 && ball.y > ay && ball.y < ay + 80) {
        ball.vx = -Math.abs(ball.vx) * 1.05;
        ball.vy += (ball.y - (ay + 40)) * 0.14;
      }

      if (ball.x < 0) {
        ai++; document.getElementById('ai').textContent = ai; serve();
      }
      if (ball.x > W) {
        you++; document.getElementById('you').textContent = you; serve();
      }
      if (you >= 7 || ai >= 7) {
        over = true;
        if (ai >= 7) window.shrimpyLose && window.shrimpyLose();
      }
    }

    drawArena();
    drawPaddle(18, py, '#67e8f9', '#22d3ee');
    drawPaddle(W - 32, ay, '#ff5c39', '#ff5c39');
    drawBall();

    if (over) {
      ctx.fillStyle = 'rgba(5,8,20,0.62)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#fff';
      ctx.font = '700 34px Orbitron, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(you >= 7 ? 'YOU WIN' : 'AI WINS', W / 2, H / 2 - 6);
      ctx.font = '14px Space Grotesk, sans-serif';
      ctx.fillStyle = '#8ba3c7';
      ctx.fillText('Click to rematch', W / 2, H / 2 + 28);
    }
    requestAnimationFrame(frame);
  }

  function onKey(e, down) {
    const k = e.key;
    if (['ArrowUp', 'ArrowDown', 'w', 'W', 's', 'S'].includes(k)) {
      e.preventDefault();
      if (down) keys.add(k); else keys.delete(k);
      // normalize letter case variants
      if (k === 'w' || k === 'W') down ? keys.add('w') : keys.delete('w');
      if (k === 's' || k === 'S') down ? keys.add('s') : keys.delete('s');
    }
  }
  addEventListener('keydown', (e) => onKey(e, true));
  addEventListener('keyup', (e) => onKey(e, false));
  canvas.addEventListener('mousemove', (e) => {
    const r = canvas.getBoundingClientRect();
    const scale = H / r.height;
    py = (e.clientY - r.top) * scale - 40;
  });
  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const t = e.touches[0], r = canvas.getBoundingClientRect();
    py = (t.clientY - r.top) * (H / r.height) - 40;
  }, { passive: false });
  canvas.addEventListener('click', () => {
    canvas.focus();
    if (over && !window.__shrLost) reset();
  });
  canvas.focus();
  reset();
  frame();
})();
</script>
<script>
(function(){
  window.__shrLost=false;
  window.shrimpyLose=function(){
    if(window.__shrLost) return;
    window.__shrLost=true;
    try{ parent.postMessage({type:'shrimpy-lose', game: location.pathname}, '*'); }catch(e){}
  };
  window.shrimpyReady=function(){
    window.__shrLost=false;
    try{ parent.postMessage({type:'shrimpy-ready', game: location.pathname}, '*'); }catch(e){}
  };
  window.addEventListener('message', function(e){
    if(!e.data || e.data.type!=='shrimpy-unlock') return;
    window.__shrLost=false;
    location.reload();
  });
  window.shrimpyReady();
})();
</script>
</body>
</html>
