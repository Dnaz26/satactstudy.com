<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Snake</title>
<style>
  :root { --bg:#fffaf7; --panel:#ffffff; --ink:#1a1412; --muted:#8a7168; --accent:#ff5c39; --ok:#22a06b; --line:rgba(201,68,36,0.12); }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background: transparent; color:var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding:12px; gap:10px; }
  h1 { margin:0; font-size:1.15rem; letter-spacing:.02em; }
  .hud { display:flex; gap:14px; flex-wrap:wrap; align-items:center; justify-content:center; color:var(--muted); font-size:.9rem; }
  .hud b { color:var(--ink); }
  canvas, .board { background:var(--panel); border:1px solid #243149; border-radius:14px; box-shadow:0 10px 40px rgba(0,0,0,.35); touch-action:none; }
  button { appearance:none; border:0; border-radius:999px; padding:10px 16px; background:var(--accent); color:#fff; font-weight:700; cursor:pointer; }
  button.secondary { background:#243149; color:var(--ink); }
  .row { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .hint { color:var(--muted); font-size:.8rem; text-align:center; max-width:520px; }
  .grid { display:grid; gap:6px; }
  .cell { display:flex; align-items:center; justify-content:center; border-radius:8px; background:#1a2438; cursor:pointer; user-select:none; }

  html, body { width:100%; height:100%; margin:0; overflow:hidden; }
  body { min-height:100vh; min-height:100dvh; justify-content:center; padding: clamp(8px, 2vh, 16px); gap:8px; }
  h1 { font-size: clamp(1rem, 2.4vh, 1.25rem); }
  canvas { width: min(96vw, 920px) !important; height: auto !important; max-height: min(78vh, 78dvh); }
  .board { max-width: min(96vw, 920px); }


  body { display:flex; flex-direction:column; align-items:center; justify-content:center; }
  canvas {
    width: min(96vw, 1100px) !important;
    height: auto !important;
    max-height: min(82vh, 82dvh);
  }
  .board { width: min(96vw, 720px); }
  .row, .hud, h1, .hint { flex-shrink: 0; }


  html, body {
    background:
      radial-gradient(900px 520px at 50% -8%, #ffffff 0%, transparent 58%),
      radial-gradient(720px 420px at 8% 40%, rgba(255, 92, 57, 0.10), transparent 55%),
      radial-gradient(640px 380px at 92% 30%, rgba(255, 212, 200, 0.45), transparent 50%),
      #fffaf7 !important;
  }
  canvas, .board {
    background: #ffffff !important;
    border: 1px solid rgba(201,68,36,0.12) !important;
    box-shadow: 0 18px 50px rgba(40,24,12,0.08) !important;
  }
  h1 { color: #1a1412 !important; }
  .hud { color: #8a7168 !important; }
  .hud b { color: #1a1412 !important; }
  .hint { color: #8a7168 !important; }
  button { background: #ff5c39 !important; }
  button.secondary { background: #fff5f0 !important; color: #1a1412 !important; border: 1px solid rgba(201,68,36,0.12); }
  .cell { background: #fff5f0 !important; color: #1a1412; border: 1px solid rgba(201,68,36,0.08); }
  /* body-bg-cream */
</style>
</head>
<body>

<h1>Snake</h1>
<div class="hud"><span>Score <b id="score">0</b></span><span>Best <b id="best">0</b></span></div>
<canvas id="c" width="400" height="400"></canvas>
<div class="row"><button id="restart">Restart</button></div>
<p class="hint">Arrow keys / WASD to move. Don&apos;t hit walls or yourself.</p>

<script>

const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const N=20,S=canvas.width/N; let snake,dir,food,score,alive,tick;
const bestKey='shrimpy-snake-best'; document.getElementById('best').textContent=localStorage.getItem(bestKey)||0;
function reset(){snake=[{x:10,y:10}];dir={x:1,y:0};score=0;alive=true;place();draw();document.getElementById('score').textContent=0;}
function place(){do{food={x:(Math.random()*N)|0,y:(Math.random()*N)|0};}while(snake.some(s=>s.x===food.x&&s.y===food.y));}
function step(){if(!alive)return; const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(s=>s.x===h.x&&s.y===h.y)){alive=false;window.shrimpyLose&&window.shrimpyLose();draw();return;}
  snake.unshift(h); if(h.x===food.x&&h.y===food.y){score++;document.getElementById('score').textContent=score;
    const b=Math.max(score,+(localStorage.getItem(bestKey)||0)); localStorage.setItem(bestKey,b); document.getElementById('best').textContent=b; place();}
  else snake.pop(); draw();}
function draw(){ctx.fillStyle='#fffaf7';ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#22c55e';snake.forEach((s,i)=>{ctx.fillRect(s.x*S+1,s.y*S+1,S-2,S-2); if(i===0){ctx.fillStyle='#86efac';}}});
  ctx.fillStyle='#ff5c39';ctx.beginPath();ctx.arc(food.x*S+S/2,food.y*S+S/2,S*0.35,0,Math.PI*2);ctx.fill();
  if(!alive){ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#fff';ctx.font='bold 28px sans-serif';ctx.textAlign='center';ctx.fillText('Game Over',200,200);}}
addEventListener('keydown',e=>{const k=e.key.toLowerCase(); const m={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]};
  if(m[k]){e.preventDefault(); const [x,y]=m[k]; if(x!==-dir.x||y!==-dir.y)dir={x,y};}});
document.getElementById('restart').onclick=()=>{if(!window.__shrLost)reset();}; reset(); clearInterval(tick); tick=setInterval(step,110);

</script>

<script>
(function(){
  window.__shrLost=false;
  window.shrimpyLose=function(){
    if(window.__shrLost) return;
    window.__shrLost=true;
    try{ parent.postMessage({type:'shrimpy-lose', game: location.pathname}, '*'); }catch(e){}
  };
  window.shrimpyReady=function(){
    window.__shrLost=false;
    try{ parent.postMessage({type:'shrimpy-ready', game: location.pathname}, '*'); }catch(e){}
  };
  window.addEventListener('message', function(e){
    if(!e.data || e.data.type!=='shrimpy-unlock') return;
    window.__shrLost=false;
    location.reload();
  });
  document.addEventListener('DOMContentLoaded', function(){ window.shrimpyReady && window.shrimpyReady(); });
  window.shrimpyReady();
})();
</script>

</body>
</html>
