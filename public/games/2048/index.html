<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>2048</title>
<style>
  :root { --bg:#fffaf7; --panel:#ffffff; --ink:#1a1412; --muted:#8a7168; --accent:#ff5c39; --ok:#22a06b; --line:rgba(201,68,36,0.12); }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background: transparent; color:var(--ink); font-family: ui-sans-serif, system-ui, sans-serif; }
  body { display:flex; flex-direction:column; align-items:center; padding:12px; gap:10px; }
  h1 { margin:0; font-size:1.15rem; }
  .hud { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; color:var(--muted); font-size:.9rem; }
  .hud b { color:var(--ink); }
  canvas, .board { background:var(--panel); border:1px solid #243149; border-radius:14px; box-shadow:0 10px 40px rgba(0,0,0,.35); touch-action:none; }
  button { appearance:none; border:0; border-radius:999px; padding:10px 16px; background:var(--accent); color:#fff; font-weight:700; cursor:pointer; }
  button.secondary { background:#243149; color:var(--ink); }
  .row { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .hint { color:var(--muted); font-size:.8rem; text-align:center; max-width:520px; }
  .grid { display:grid; gap:4px; }
  .cell { display:flex; align-items:center; justify-content:center; border-radius:6px; background:#1a2438; cursor:pointer; user-select:none; font-weight:700; }
  input { width:28px; text-align:center; background:#1a2438; border:1px solid #243149; color:var(--ink); border-radius:6px; padding:6px 0; }

  html, body { width:100%; height:100%; margin:0; overflow:hidden; }
  body { min-height:100vh; min-height:100dvh; justify-content:center; padding: clamp(8px, 2vh, 16px); gap:8px; }
  h1 { font-size: clamp(1rem, 2.4vh, 1.25rem); }
  canvas { width: min(96vw, 920px) !important; height: auto !important; max-height: min(78vh, 78dvh); }
  .board { max-width: min(96vw, 920px); }


  body { display:flex; flex-direction:column; align-items:center; justify-content:center; }
  canvas {
    width: min(96vw, 1100px) !important;
    height: auto !important;
    max-height: min(82vh, 82dvh);
  }
  .board { width: min(96vw, 720px); }
  .row, .hud, h1, .hint { flex-shrink: 0; }


  html, body {
    background:
      radial-gradient(900px 520px at 50% -8%, #ffffff 0%, transparent 58%),
      radial-gradient(720px 420px at 8% 40%, rgba(255, 92, 57, 0.10), transparent 55%),
      radial-gradient(640px 380px at 92% 30%, rgba(255, 212, 200, 0.45), transparent 50%),
      #fffaf7 !important;
  }
  canvas, .board {
    background: #ffffff !important;
    border: 1px solid rgba(201,68,36,0.12) !important;
    box-shadow: 0 18px 50px rgba(40,24,12,0.08) !important;
  }
  h1 { color: #1a1412 !important; }
  .hud { color: #8a7168 !important; }
  .hud b { color: #1a1412 !important; }
  .hint { color: #8a7168 !important; }
  button { background: #ff5c39 !important; }
  button.secondary { background: #fff5f0 !important; color: #1a1412 !important; border: 1px solid rgba(201,68,36,0.12); }
  .cell { background: #fff5f0 !important; color: #1a1412; border: 1px solid rgba(201,68,36,0.08); }
  /* body-bg-cream */
</style>
</head>
<body>

<h1>2048</h1>
<div class="hud"><span>Score <b id="score">0</b></span></div>
<div id="board" class="grid board" style="padding:10px;grid-template-columns:repeat(4,72px);grid-template-rows:repeat(4,72px);"></div>
<div class="row"><button id="restart">New game</button></div>
<p class="hint">Arrow keys / swipe to slide tiles.</p>

<script>

const boardEl=document.getElementById('board'); let grid,score;
const colors={0:'#1a2438',2:'#334155',4:'#475569',8:'#f97316',16:'#ea580c',32:'#dc2626',64:'#b91c1c',128:'#eab308',256:'#ca8a04',512:'#a16207',1024:'#22c55e',2048:'#16a34a'};
function spawn(){const empty=[]; for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(!grid[r][c])empty.push([r,c]); if(!empty.length)return; const [r,c]=empty[(Math.random()*empty.length)|0]; grid[r][c]=Math.random()<0.9?2:4;}
function draw(){boardEl.innerHTML=''; for(let r=0;r<4;r++)for(let c=0;c<4;c++){const v=grid[r][c]; const d=document.createElement('div'); d.className='cell'; d.style.width='72px';d.style.height='72px'; d.style.background=colors[v]||'#0ea5e9'; d.style.fontSize=v>512?'18px':'22px'; d.textContent=v||''; boardEl.appendChild(d);} document.getElementById('score').textContent=score;}
function slideLine(line){const a=line.filter(Boolean); for(let i=0;i<a.length-1;i++){if(a[i]===a[i+1]){a[i]*=2;score+=a[i];a.splice(i+1,1);}} while(a.length<4)a.push(0); return a;}
function isDead(){for(let r=0;r<4;r++)for(let c=0;c<4;c++){if(!grid[r][c])return false; if(c<3&&grid[r][c]===grid[r][c+1])return false; if(r<3&&grid[r][c]===grid[r+1][c])return false;} return true;}
function move(dir){const before=JSON.stringify(grid); let g=grid.map(r=>r.slice());
  if(dir===0)g=g.map(slideLine); // left
  if(dir===2)g=g.map(r=>slideLine(r.slice().reverse()).reverse()); // right
  if(dir===1){ // up
    for(let c=0;c<4;c++){const col=slideLine([g[0][c],g[1][c],g[2][c],g[3][c]]); for(let r=0;r<4;r++)g[r][c]=col[r];}
  }
  if(dir===3){ // down
    for(let c=0;c<4;c++){const col=slideLine([g[3][c],g[2][c],g[1][c],g[0][c]]); for(let r=0;r<4;r++)g[3-r][c]=col[r];}
  }
  if(JSON.stringify(g)!==before){grid=g; spawn(); draw(); if(isDead()) window.shrimpyLose&&window.shrimpyLose();}}
function reset(){grid=Array.from({length:4},()=>[0,0,0,0]); score=0; spawn(); spawn(); draw();}
addEventListener('keydown',e=>{const map={ArrowLeft:0,ArrowUp:1,ArrowRight:2,ArrowDown:3}; if(map[e.key]!=null){e.preventDefault(); move(map[e.key]);}});
let sx,sy; boardEl.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
boardEl.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy; if(Math.abs(dx)<20&&Math.abs(dy)<20)return; if(Math.abs(dx)>Math.abs(dy))move(dx>0?2:0); else move(dy>0?3:1);});
document.getElementById('restart').onclick=()=>{if(!window.__shrLost)reset();}; reset();

</script>

<script>
(function(){
  window.__shrLost=false;
  window.shrimpyLose=function(){
    if(window.__shrLost) return;
    window.__shrLost=true;
    try{ parent.postMessage({type:'shrimpy-lose', game: location.pathname}, '*'); }catch(e){}
  };
  window.shrimpyReady=function(){
    window.__shrLost=false;
    try{ parent.postMessage({type:'shrimpy-ready', game: location.pathname}, '*'); }catch(e){}
  };
  window.addEventListener('message', function(e){
    if(!e.data || e.data.type!=='shrimpy-unlock') return;
    window.__shrLost=false;
    location.reload();
  });
  document.addEventListener('DOMContentLoaded', function(){ window.shrimpyReady && window.shrimpyReady(); });
  window.shrimpyReady();
})();
</script>

</body>
</html>
