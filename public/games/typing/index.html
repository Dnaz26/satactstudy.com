<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#172554,#020617 62%);color:#fff;font-family:system-ui;overflow:hidden}.stage{height:100vh;display:grid;place-items:center;padding:5vw}.panel{width:min(900px,94vw);border:1px solid #22d3ee66;background:#07111fe8;border-radius:28px;padding:32px;box-shadow:0 0 80px #0891b244}.top{display:flex;justify-content:space-between;font-weight:800;letter-spacing:.14em;color:#67e8f9}.prompt{margin-top:28px;font-size:clamp(24px,4vw,48px);line-height:1.4;font-weight:800;letter-spacing:.02em}.done{color:#22c55e}.next{color:#fff}.rest{color:#64748b}.cursor{border-left:4px solid #22d3ee;animation:b .55s infinite}.status{margin-top:25px;display:flex;justify-content:space-between}.meter{height:10px;background:#172033;border-radius:20px;overflow:hidden;margin-top:18px}.bar{height:100%;width:0;background:linear-gradient(90deg,#22d3ee,#22c55e);transition:.12s}@keyframes b{50%{opacity:0}}.shake{animation:s .25s}@keyframes s{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}.flash{position:fixed;inset:0;background:#ef4444;opacity:0;pointer-events:none}.bad{animation:f .45s}@keyframes f{30%{opacity:.45}}</style></head><body><div class="flash"></div><div class="stage"><div class="panel"><div class="top"><span>AI TYPING RUSH</span><span id="round">ROUND 1</span></div><div class="prompt" id="prompt"></div><div class="meter"><div class="bar" id="bar"></div></div><div class="status"><span>Type every character exactly.</span><b id="accuracy">100% ACCURACY</b></div></div></div><script>const prompts=['Precise practice turns difficult patterns into automatic decisions.','Strong readers test every claim against the evidence in the passage.','A quadratic model can reveal where a changing quantity reaches its maximum.','Consistent review makes unfamiliar questions feel easier under pressure.'];let round=0,pos=0,text=prompts[0],locked=false;const p=document.querySelector('#prompt'),bar=document.querySelector('#bar'),panel=document.querySelector('.panel'),flash=document.querySelector('.flash');function draw(){p.innerHTML='<span class="done">'+text.slice(0,pos)+'</span><span class="next cursor">'+(text[pos]||'')+'</span><span class="rest">'+text.slice(pos+1)+'</span>';bar.style.width=(pos/text.length*100)+'%'}draw();addEventListener('keydown',e=>{if(locked||e.key.length!==1)return;if(e.key===text[pos]){pos++;draw();if(pos===text.length){locked=true;document.querySelector('#accuracy').textContent='LEVEL CLEAR — 3 QUESTIONS';parent.postMessage({type:'shrimpy-level'},'*')}}else{panel.classList.add('shake');flash.classList.add('bad');setTimeout(()=>{panel.classList.remove('shake');flash.classList.remove('bad')},250)}});addEventListener('message',e=>{if(e.data?.type==='shrimpy-unlock'){locked=false;round++;pos=0;text=prompts[round%prompts.length];document.querySelector('#round').textContent='ROUND '+(round+1);document.querySelector('#accuracy').textContent='100% ACCURACY';draw()}});</script></body></html>
