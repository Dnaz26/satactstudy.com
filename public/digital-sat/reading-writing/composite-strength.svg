<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title"><title id="title">Mean breaking force by fiber orientation and polishing</title><rect width="720" height="440" fill="white"/><g font-family="Arial,sans-serif" fill="#111"><text x="20" y="30" font-size="22" font-weight="bold">Mean breaking force (N)</text><path d="M220 60V310" stroke="#ccc"/><text x="210" y="345" font-size="18">0</text><path d="M320 60V310" stroke="#ccc"/><text x="310" y="345" font-size="18">50</text><path d="M420 60V310" stroke="#ccc"/><text x="410" y="345" font-size="18">100</text><path d="M520 60V310" stroke="#ccc"/><text x="510" y="345" font-size="18">150</text><rect x="220" y="85" width="240" height="30" fill="#ddd" stroke="#111"/><text x="470" y="107" font-size="18">120</text><rect x="220" y="125" width="300" height="30" fill="#555" stroke="#111"/><text x="530" y="147" font-size="18">150</text><rect x="220" y="220" width="160" height="30" fill="#ddd" stroke="#111"/><text x="390" y="242" font-size="18">80</text><rect x="220" y="260" width="180" height="30" fill="#555" stroke="#111"/><text x="410" y="282" font-size="18">90</text><text x="20" y="120" font-size="20">Aligned fibers</text><text x="20" y="255" font-size="20">Random fibers</text><rect x="220" y="385" width="25" height="20" fill="#ddd" stroke="#111"/><text x="255" y="403" font-size="18">Unpolished</text><rect x="430" y="385" width="25" height="20" fill="#555"/><text x="465" y="403" font-size="18">Polished</text></g></svg>