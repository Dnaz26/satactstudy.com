<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Snake</title>
<style>
  html, body { margin: 0; height: 100%; background: #a7d948; overflow: hidden; font-family: Arial, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { width: min(100vw, 100vh); height: min(100vw, 100vh); touch-action: none; background: #a7d948; }
  .score { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); color: #fff; font-weight: 800; font-size: 28px; text-shadow: 0 2px 0 #4a752c; }
</style>
</head>
<body>
<div class="score" id="score">0</div>
<canvas id="c" width="600" height="600"></canvas>
<script>
const canvas = document.getElementById('c')
const ctx = canvas.getContext('2d')
const N = 21
const cell = canvas.width / N
let snake = [{ x: 10, y: 10 }]
let dir = { x: 1, y: 0 }
let next = { x: 1, y: 0 }
let food = { x: 15, y: 10 }
let score = 0
let alive = true
let tick = 0
function place() {
  do { food = { x: (Math.random() * N) | 0, y: (Math.random() * N) | 0 } }
  while (snake.some((part) => part.x === food.x && part.y === food.y))
}
function turn(x, y) {
  if (x === -dir.x && y === -dir.y) return
  next = { x, y }
}
function step() {
  if (!alive) return
  dir = next
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y }
  if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N || snake.some((part) => part.x === head.x && part.y === head.y)) {
    alive = false
    draw()
    window.shrimpyLose && window.shrimpyLose()
    return
  }
  snake.unshift(head)
  if (head.x === food.x && head.y === food.y) {
    score += 1
    document.getElementById('score').textContent = String(score)
    place()
  } else snake.pop()
  draw()
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath()
  ctx.moveTo(x + r, y)
  ctx.arcTo(x + w, y, x + w, y + h, r)
  ctx.arcTo(x + w, y + h, x, y + h, r)
  ctx.arcTo(x, y + h, x, y, r)
  ctx.arcTo(x, y, x + w, y, r)
  ctx.closePath()
  ctx.fill()
}
function draw() {
  for (let y = 0; y < N; y += 1) {
    for (let x = 0; x < N; x += 1) {
      ctx.fillStyle = (x + y) % 2 === 0 ? '#a7d948' : '#8ecc39'
      ctx.fillRect(x * cell, y * cell, cell, cell)
    }
  }
  ctx.fillStyle = '#e7471d'
  ctx.beginPath()
  ctx.arc(food.x * cell + cell / 2, food.y * cell + cell / 2, cell * 0.32, 0, Math.PI * 2)
  ctx.fill()
  snake.forEach((part, index) => {
    ctx.fillStyle = index === 0 ? '#4674e0' : '#4a7cf0'
    roundRect(part.x * cell + 2, part.y * cell + 2, cell - 4, cell - 4, 8)
  })
  if (!alive) {
    ctx.fillStyle = 'rgba(0,0,0,.35)'
    ctx.fillRect(0, 0, canvas.width, canvas.height)
    ctx.fillStyle = '#fff'
    ctx.font = 'bold 48px Arial'
    ctx.textAlign = 'center'
    ctx.fillText('Game over', canvas.width / 2, canvas.height / 2)
  }
}
addEventListener('keydown', (event) => {
  const key = event.key.toLowerCase()
  const map = { arrowup: [0, -1], w: [0, -1], arrowdown: [0, 1], s: [0, 1], arrowleft: [-1, 0], a: [-1, 0], arrowright: [1, 0], d: [1, 0] }
  if (map[key]) { event.preventDefault(); turn(map[key][0], map[key][1]) }
})
let touch = null
const readyAt = performance.now() + 700
canvas.addEventListener('pointerdown', (event) => { touch = { x: event.clientX, y: event.clientY } })
canvas.addEventListener('pointerup', (event) => {
  if (!touch || performance.now() < readyAt) { touch = null; return }
  const dx = event.clientX - touch.x
  const dy = event.clientY - touch.y
  touch = null
  if (Math.hypot(dx, dy) < 28) return
  if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0)
  else turn(0, dy > 0 ? 1 : -1)
})
draw()
tick = setInterval(step, 140)
window.shrimpyLose = function () {
  if (window.__shrLost) return
  window.__shrLost = true
  try { parent.postMessage({ type: 'shrimpy-lose', game: location.pathname }, '*') } catch (e) {}
}
window.addEventListener('message', (event) => {
  if (!event.data || event.data.type !== 'shrimpy-unlock') return
  window.__shrLost = false
  location.reload()
})
</script>
</body>
</html>
